<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07060a" />
  <title>Room: Go To Hell</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hearts"></div>
      <div id="mana"><div id="mana-fill"></div><span id="mana-t"></span></div>
      <div id="inventory"></div>
      <div id="crosshair"></div>
      <div id="prompt" class="hidden"></div>
      <div id="log"></div>
      <div id="cooldown" class="hidden"><div id="cooldown-fill"></div></div>
      <div id="objective"></div>
      <div id="boss" class="hidden"><div id="boss-name"></div><div id="boss-bar"><div id="boss-fill"></div></div></div>
      <div id="timer" class="hidden"><span id="timer-t">0:00.0</span><small id="timer-s"></small></div>
      <div id="vignette"></div>
      <div id="flash"></div>
    </div>

    <!-- Touch controls -->
    <div id="touch" class="hidden">
      <div id="stick"><div id="stick-knob"></div></div>
      <div id="touch-buttons">
        <button data-act="use" class="tbtn big">Use</button>
        <button data-act="cast" class="tbtn big accent">Cast</button>
        <button data-act="book" class="tbtn">Spells</button>
        <button data-act="lamp" class="tbtn">Lamp</button>
        <button data-act="search" class="tbtn">Search</button>
        <button data-act="pause" class="tbtn small">II</button>
      </div>
    </div>

    <!-- Photo mode -->
    <div id="photo" class="hidden">
      <div class="ph-row" id="ph-filters"></div>
      <div class="ph-row">
        <label>FOV <input type="range" id="ph-fov" min="20" max="110" step="1"></label>
        <button class="btn primary" id="ph-shot">📸 Capture</button>
        <button class="btn" id="ph-exit">Exit</button>
      </div>
      <div class="ph-hint">Click the view to look (Esc frees the mouse) · fly: move keys / stick · up/down: E / Q</div>
      <div id="ph-preview" class="hidden"></div>
    </div>

    <!-- Screens / dialogs -->
    <div id="screen" class="hidden"></div>
    <div id="dialog" class="hidden"></div>
    <div id="toasts"></div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
